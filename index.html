<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GLB ビューア</title>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<style>
:root{--bg:#16181d;--panel:#1e2128;--line:#2e333d;--text:#e6e8ec;--sub:#8d94a3;--acc:#4da3ff;--r:6px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
 display:flex;flex-direction:column;height:100dvh;overflow:hidden;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:600;flex:1;white-space:nowrap}
button,select,input[type=search]{font:inherit;color:var(--text);background:#2a2f39;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;min-height:34px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#06121f;border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:6px 8px 0;min-height:42px;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:4px;max-width:200px;flex:none;padding:6px 6px 6px 12px;border:1px solid var(--line);border-bottom:0;
 border-radius:var(--r) var(--r) 0 0;background:#20242b;color:var(--sub);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--panel);color:var(--text);border-color:var(--acc);border-bottom:0}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab b{font-weight:400;padding:0 6px;border-radius:4px;font-size:16px;line-height:1.2}
.tab b:hover{background:#3a404c}
main{flex:1;display:flex;min-height:0}
#view{flex:1;position:relative;min-width:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;color:var(--sub)}
#drop{position:absolute;inset:8px;border:2px dashed var(--acc);border-radius:10px;display:none;align-items:center;justify-content:center;background:#4da3ff22;pointer-events:none;font-size:18px}
body.dragging #drop{display:flex}
#toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#000c;padding:6px 14px;border-radius:20px;font-size:13px;display:none;max-width:90%;text-align:center}
#panel{width:340px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;-webkit-overflow-scrolling:touch}
details{border-bottom:1px solid var(--line)}
summary{padding:10px 12px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--sub)}
details:not([open]) summary::after{content:"▸"}
.body{padding:0 12px 12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
label.item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:4px;cursor:pointer;min-height:36px}
label.item:hover,.bone:hover{background:#ffffff0a}
label.item span{flex:1;word-break:break-all}
small,.sub{color:var(--sub);font-size:12px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);flex:none}
dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
dt{color:var(--sub)}dd{margin:0;word-break:break-all}
.bones{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);margin-top:6px}
.bone{display:block;width:100%;text-align:left;border:0;background:none;border-radius:0;padding:3px 8px;min-height:28px;white-space:nowrap;font-size:13px}
.bone.sel{background:#4da3ff33;color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 8px;border:1px solid var(--line);border-radius:10px;font-size:12px;color:var(--sub)}
@media (max-width:820px){
 main{flex-direction:column}
 #view{flex:none;height:46%}
 #panel{width:auto;flex:1;border-left:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
 <h1>GLB ビューア</h1>
 <button class="primary" id="pick">ファイルを選択</button>
 <input id="file" type="file" multiple hidden>
</header>
<div id="tabs" role="tablist"></div>
<main>
 <div id="view">
  <div id="empty"><div style="font-size:16px;color:var(--text)">GLB / glTF ファイルを開く</div>
   <div>「ファイルを選択」か、ここにドラッグ＆ドロップ。<br>複数ファイルを同時に追加できます。</div></div>
  <div id="drop">ここにドロップ</div>
  <div id="toast"></div>
 </div>
 <aside id="panel"></aside>
</main>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtB=n=>n>1048576?(n/1048576).toFixed(2)+' MB':(n/1024).toFixed(1)+' KB';
const BG={dark:0x16181d,gray:0x808080,light:0xeeeeee,white:0xffffff};

/* ---------- three.js setup ---------- */
const view=$('#view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
view.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(BG.dark);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity=0.5;
scene.add(new THREE.HemisphereLight(0xffffff,0x888888,1.2));
const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(3,5,4);scene.add(sun);
const camera=new THREE.PerspectiveCamera(45,1,0.01,1000);
camera.position.set(2,1.5,3);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
const grid=new THREE.GridHelper(10,20,0x667080,0x3a404c);
scene.add(grid);
const marker=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xff4d6d,depthTest:false,transparent:true}));
marker.renderOrder=999;marker.visible=false;scene.add(marker);

new ResizeObserver(()=>{
 const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}).observe(view);

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=clock.getDelta();
 if(cur){
  cur.mixer.update(dt);
  if(cur.sel){cur.sel.getWorldPosition(marker.position)}
 }
 controls.update();
 renderer.render(scene,camera);
});

const draco=new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
const ktx2=new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(renderer);
const loader=new GLTFLoader().setKTX2Loader(ktx2).setDRACOLoader(draco).setMeshoptDecoder(MeshoptDecoder);

/* ---------- state ---------- */
const models=[];let cur=null,uid=0;
const opt={grid:true,wire:false,bones:false,rotate:false,bg:'dark',speed:1,paused:false};

let tt;
function toast(msg,ms=2500){const t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(tt);if(ms)tt=setTimeout(()=>t.style.display='none',ms)}

/* ---------- loading ---------- */
async function addFiles(files){
 for(const f of files){
  if(!/\.(glb|gltf)$/i.test(f.name)){toast(`${f.name}: 非対応の形式です（.glb / .gltf）`);continue}
  try{
   toast(`読み込み中: ${f.name}`,0);
   const gltf=await loader.parseAsync(await f.arrayBuffer(),'');
   addModel(f,gltf);
   toast(`${f.name} を追加しました`);
  }catch(e){
   console.error(e);
   toast(`${f.name}: 読み込めません。${/\.gltf$/i.test(f.name)?'外部ファイル参照の .gltf は .glb にまとめてください。':''}`,5000);
  }
 }
}

function addModel(file,gltf){
 const root=gltf.scene;
 const m={id:++uid,name:file.name,size:file.size,gltf,root,mixer:new THREE.AnimationMixer(root),
  clips:gltf.animations,actions:[],meshes:[],bones:[],skeletons:[],mats:new Set(),tex:new Set(),tris:0,verts:0,sel:null,cam:null,helper:null};
 const skel=new Set();
 root.traverse(o=>{
  if(o.isBone)m.bones.push(o);
  if(o.isMesh){
   m.meshes.push(o);
   const g=o.geometry,p=g.attributes.position;
   if(p){m.verts+=p.count;m.tris+=(g.index?g.index.count:p.count)/3}
   (Array.isArray(o.material)?o.material:[o.material]).forEach(mt=>{
    m.mats.add(mt);
    for(const k in mt){const v=mt[k];if(v&&v.isTexture)m.tex.add(v)}
   });
   if(o.isSkinnedMesh)skel.add(o.skeleton);
  }
 });
 m.skeletons=[...skel].map(s=>({s,users:m.meshes.filter(x=>x.skeleton===s).map(x=>x.name||'(無名)')}));
 m.actions=m.clips.map(c=>m.mixer.clipAction(c));
 if(m.bones.length){m.helper=new THREE.SkeletonHelper(root);m.helper.material.depthTest=false;m.helper.renderOrder=998}
 models.push(m);
 activate(m);
 if(m.actions.length){m.actions[0].play();renderPanel()}
}

function fit(m){
 const box=new THREE.Box3().setFromObject(m.root);
 const size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
 const d=Math.max(size.x,size.y,size.z)||1;
 m.size3=size;m.d=d;m.floor=box.min.y;
 camera.near=d/1000;camera.far=d*100;camera.updateProjectionMatrix();
 camera.position.copy(c).add(new THREE.Vector3(.8,.5,1.2).multiplyScalar(d*1.3));
 controls.target.copy(c);controls.update();
}

/* ---------- activate / close ---------- */
function activate(m){
 if(cur){
  cur.cam={p:camera.position.clone(),t:controls.target.clone()};
  scene.remove(cur.root);if(cur.helper)scene.remove(cur.helper);
 }
 cur=m;marker.visible=false;
 if(m){
  scene.add(m.root);if(m.helper)scene.add(m.helper);
  if(m.cam){camera.position.copy(m.cam.p);controls.target.copy(m.cam.t);controls.update()}else fit(m);
  const s=m.d*0.012;marker.scale.setScalar(s);
  grid.scale.setScalar(m.d*2.5/10);grid.position.y=m.floor;
  marker.visible=!!m.sel;
  m.mixer.timeScale=opt.paused?0:opt.speed;
  applyOpts();
 }
 $('#empty').style.display=m?'none':'flex';
 renderTabs();renderPanel();
}

function closeModel(m){
 const i=models.indexOf(m);if(i<0)return;
 m.mixer.stopAllAction();
 const wasCur=cur===m;
 if(wasCur){scene.remove(m.root);if(m.helper)scene.remove(m.helper);cur=null}
 m.meshes.forEach(o=>o.geometry.dispose());
 m.mats.forEach(x=>x.dispose());m.tex.forEach(x=>x.dispose());
 models.splice(i,1);
 if(wasCur)activate(models[Math.min(i,models.length-1)]||null);else renderTabs();
}

function applyOpts(){
 grid.visible=opt.grid;
 scene.background=new THREE.Color(BG[opt.bg]);
 controls.autoRotate=opt.rotate;
 if(cur){
  cur.mats.forEach(x=>x.wireframe=opt.wire);
  if(cur.helper)cur.helper.visible=opt.bones;
 }
}

/* ---------- UI ---------- */
function renderTabs(){
 const t=$('#tabs');
 t.innerHTML=models.map(m=>`<div class="tab ${m===cur?'on':''}" role="tab" data-id="${m.id}" title="${esc(m.name)}"><span>${esc(m.name)}</span><b data-x="${m.id}" aria-label="閉じる">×</b></div>`).join('');
 t.querySelectorAll('.tab').forEach(el=>el.onclick=e=>{
  const m=models.find(x=>x.id==el.dataset.id);
  if(e.target.dataset.x){closeModel(m)}else if(m!==cur)activate(m);
 });
 t.querySelector('.on')?.scrollIntoView({inline:'nearest',block:'nearest'});
}

function renderPanel(){
 const p=$('#panel'),m=cur;
 if(!m){p.innerHTML='';return}
 const gj=m.gltf.parser.json,ext=gj.extensionsUsed||[];
 const tex=[...m.tex].length;
 const info=[
  ['ファイル',esc(m.name)],['サイズ',fmtB(m.size)],
  ['三角形',Math.round(m.tris).toLocaleString()],['頂点',m.verts.toLocaleString()],
  ['メッシュ',m.meshes.length],['マテリアル',m.mats.size],['テクスチャ',tex],
  ['ボーン',m.bones.length],['アニメ',m.clips.length],
  ['寸法',m.size3?[m.size3.x,m.size3.y,m.size3.z].map(v=>v.toPrecision(3)).join(' × '):'-'],
  ['生成元',esc(gj.asset?.generator||'-')],['glTF版',esc(gj.asset?.version||'-')]
 ].map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');

 const anim=m.clips.length?`
  <div class="row">
   <button id="pp">${opt.paused?'▶ 再生':'⏸ 停止'}</button>
   <button id="rs">⏮ 最初から</button>
   <select id="spd">${[0.25,0.5,1,2].map(v=>`<option ${v==opt.speed?'selected':''} value="${v}">${v}x</option>`).join('')}</select>
  </div>
  <div class="row"><button id="aall">全て選択</button><button id="anone">全て解除</button></div>
  ${m.clips.map((c,i)=>`<label class="item"><input type="checkbox" data-clip="${i}" ${m.actions[i].isRunning()?'checked':''}><span>${esc(c.name||'(無名)')}</span><small>${c.duration.toFixed(2)}s・${c.tracks.length}tr</small></label>`).join('')}`
  :'<div class="sub">アニメーションは含まれていません</div>';

 const bones=m.bones.length?`
  <label class="item"><input type="checkbox" id="bshow" ${opt.bones?'checked':''}><span>ボーンを表示</span></label>
  ${m.skeletons.map((k,i)=>`<div class="sub">スキン ${i+1}: ${k.s.bones.length} ボーン／使用: ${esc(k.users.join(', '))}</div>`).join('')}
  <input type="search" id="bq" placeholder="ボーン名で絞り込み" style="width:100%;margin-top:6px">
  <div class="bones" id="blist"></div>
  <div class="sub" style="margin-top:4px">名前をタップすると3D上に印を表示</div>`
  :'<div class="sub">ボーン（リグ）は含まれていません</div>';

 const meshes=m.meshes.map((o,i)=>`<label class="item"><input type="checkbox" data-mesh="${i}" ${o.visible?'checked':''}><span>${esc(o.name||'(無名)')}</span><small>${o.isSkinnedMesh?'skinned・':''}${Math.round((o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3).toLocaleString()}△</small></label>`).join('')||'<div class="sub">なし</div>';

 const mats=[...m.mats].map(x=>`<div>${esc(x.name||'(無名)')} <small>${x.type}</small></div>`).join('')||'なし';
 const nodes=[];m.root.traverse(o=>{if(o!==m.root&&!o.isBone&&!o.isMesh)nodes.push(o)});

 p.innerHTML=`
 <details open><summary>アニメーション (${m.clips.length})</summary><div class="body">${anim}</div></details>
 <details open><summary>ボーン / リグ (${m.bones.length})</summary><div class="body">${bones}</div></details>
 <details open><summary>メッシュ (${m.meshes.length})</summary><div class="body">${meshes}</div></details>
 <details><summary>マテリアル (${m.mats.size})</summary><div class="body">${mats}</div></details>
 <details><summary>その他のノード (${nodes.length})</summary><div class="body">${nodes.map(o=>`<div>${esc(o.name||'(無名)')} <small>${o.type}</small></div>`).join('')||'なし'}</div></details>
 <details><summary>情報</summary><div class="body"><dl>${info}</dl>${ext.length?`<div class="chips" style="margin-top:8px">${ext.map(e=>`<span class="chip">${esc(e)}</span>`).join('')}</div>`:''}</div></details>
 <details open><summary>表示設定</summary><div class="body">
  <label class="item"><input type="checkbox" id="ogrid" ${opt.grid?'checked':''}><span>グリッド</span></label>
  <label class="item"><input type="checkbox" id="owire" ${opt.wire?'checked':''}><span>ワイヤーフレーム</span></label>
  <label class="item"><input type="checkbox" id="orot" ${opt.rotate?'checked':''}><span>自動回転</span></label>
  <div class="row"><select id="obg">${Object.keys(BG).map(k=>`<option value="${k}" ${k==opt.bg?'selected':''}>背景: ${k}</option>`).join('')}</select>
  <button id="ofit">視点リセット</button></div>
 </div></details>`;

 const $p=s=>p.querySelector(s);
 /* animation */
 p.querySelectorAll('[data-clip]').forEach(el=>el.onchange=()=>{
  const a=m.actions[el.dataset.clip];el.checked?a.reset().play():a.stop();
 });
 const setAll=on=>{m.actions.forEach(a=>on?a.reset().play():a.stop());p.querySelectorAll('[data-clip]').forEach(e=>e.checked=on)};
 if($p('#aall')){
  $p('#aall').onclick=()=>setAll(true);$p('#anone').onclick=()=>setAll(false);
  $p('#pp').onclick=e=>{opt.paused=!opt.paused;m.mixer.timeScale=opt.paused?0:opt.speed;e.target.textContent=opt.paused?'▶ 再生':'⏸ 停止'};
  $p('#rs').onclick=()=>m.actions.forEach(a=>{if(a.isRunning())a.reset()});
  $p('#spd').onchange=e=>{opt.speed=+e.target.value;if(!opt.paused)m.mixer.timeScale=opt.speed};
 }
 /* bones */
 if($p('#blist')){
  const depth=b=>{let d=0;while(b.parent&&b.parent.isBone){d++;b=b.parent}return d};
  const draw=q=>{
   const l=$p('#blist');q=q.toLowerCase();
   l.innerHTML=m.bones.map((b,i)=>({b,i})).filter(({b})=>!q||b.name.toLowerCase().includes(q))
    .map(({b,i})=>`<button class="bone ${m.sel===b?'sel':''}" data-b="${i}" style="padding-left:${8+(q?0:depth(b))*12}px">${esc(b.name||'(無名)')}</button>`).join('')||'<div class="sub" style="padding:8px">該当なし</div>';
   l.querySelectorAll('.bone').forEach(el=>el.onclick=()=>{
    const b=m.bones[el.dataset.b];m.sel=m.sel===b?null:b;marker.visible=!!m.sel;draw($p('#bq').value);
   });
  };
  draw('');
  $p('#bq').oninput=e=>draw(e.target.value);
  $p('#bshow').onchange=e=>{opt.bones=e.target.checked;applyOpts()};
 }
 p.querySelectorAll('[data-mesh]').forEach(el=>el.onchange=()=>{m.meshes[el.dataset.mesh].visible=el.checked});
 $p('#ogrid').onchange=e=>{opt.grid=e.target.checked;applyOpts()};
 $p('#owire').onchange=e=>{opt.wire=e.target.checked;applyOpts()};
 $p('#orot').onchange=e=>{opt.rotate=e.target.checked;applyOpts()};
 $p('#obg').onchange=e=>{opt.bg=e.target.value;applyOpts()};
 $p('#ofit').onclick=()=>fit(m);
}

/* ---------- input ---------- */
const fi=$('#file');
$('#pick').onclick=()=>fi.click();
fi.onchange=()=>{addFiles([...fi.files]);fi.value=''};
let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{if(--dc<=0){dc=0;document.body.classList.remove('dragging')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;document.body.classList.remove('dragging');addFiles([...e.dataTransfer.files])});
</script>
</body>
</html>
